name: Garnet Fork PR Failed Jobs Test

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  success:
    name: Fork relay success
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start Garnet Runtime Review
        uses: garnet-org/action@main

      - name: Request example.com marker
        shell: bash
        run: |
          set -euo pipefail
          output_file="${RUNNER_TEMP}/garnet-marker-example-com.html"
          curl --fail --silent --show-error --location --max-time 30 \
            https://example.com/ \
            --output "${output_file}"
          test -s "${output_file}"

  failure_one:
    name: Fork relay failure exit 1
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Action registers its cleanup/upload as post-if: always().
      - name: Start Garnet Runtime Review
        uses: garnet-org/action@main

      - name: Request example.org marker and fail with exit 1
        shell: bash
        run: |
          set -euo pipefail
          output_file="${RUNNER_TEMP}/garnet-marker-example-org.html"
          curl --fail --silent --show-error --location --max-time 30 \
            https://example.org/ \
            --output "${output_file}"
          test -s "${output_file}"
          echo "Intentionally failing this job with exit code 1"
          exit 1

  failure_two:
    name: Fork relay failure exit 2
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Action registers its cleanup/upload as post-if: always().
      - name: Start Garnet Runtime Review
        uses: garnet-org/action@main

      - name: Request example.net marker and fail with exit 2
        shell: bash
        run: |
          set -euo pipefail
          output_file="${RUNNER_TEMP}/garnet-marker-example-net.html"
          curl --fail --silent --show-error --location --max-time 30 \
            https://example.net/ \
            --output "${output_file}"
          test -s "${output_file}"
          echo "Intentionally failing this job with exit code 2"
          exit 2
