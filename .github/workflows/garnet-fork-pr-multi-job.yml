name: Garnet Fork PR Multiple Jobs Test

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  marker_com:
    name: Fork relay example.com
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start Garnet Runtime Review
        uses: garnet-org/action@main

      - name: Request example.com marker
        shell: bash
        run: |
          set -euo pipefail
          output_file="${RUNNER_TEMP}/garnet-marker-example-com.html"
          curl --fail --silent --show-error --location --max-time 30 \
            https://example.com/ \
            --output "${output_file}"
          test -s "${output_file}"

  marker_org:
    name: Fork relay example.org
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout without persisted credentials
